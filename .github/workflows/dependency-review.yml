name: Dependency review
on: pull_request
permissions: {}

# A newer push makes the older run's verdict worthless, so it cancels that run rather than racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # The Go standard library, x/sys and x/tools are reported as
          # `BSD-3-Clause AND LicenseRef-scancode-google-patent-license-golang`:
          # the PATENTS file is an additional permissive patent grant, not a
          # restriction, and the action resolves an AND expression only when every
          # term is allowed.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, Zlib, MPL-2.0, CC0-1.0, LicenseRef-scancode-google-patent-license-golang
          comment-summary-in-pr: never
